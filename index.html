<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plan, prioritise and track your college tasks.">
    <title>Student Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">

    <header class="top">
        <div>
            <h1>Student Task Manager</h1>
            <p id="todayLabel"></p>
        </div>
        <div class="actions">
            <button id="exportBtn" class="ghost" type="button">Export</button>
            <button id="importBtn" class="ghost" type="button">Import</button>
            <input id="importFile" type="file" accept="application/json" hidden>
            <button id="themeToggle" class="ghost" type="button" aria-pressed="false">Dark mode</button>
        </div>
    </header>

    <form id="taskForm" class="task-input" autocomplete="off" novalidate>
        <input type="hidden" id="taskId">
        <div class="field grow">
            <label for="taskInput">Task</label>
            <input type="text" id="taskInput" placeholder="e.g. Finish lab report" maxlength="120" required>
        </div>
        <div class="field">
            <label for="subjectInput">Subject</label>
            <input type="text" id="subjectInput" list="subjectList" placeholder="Optional" maxlength="40">
            <datalist id="subjectList"></datalist>
        </div>
        <div class="field">
            <label for="dueInput">Due date</label>
            <input type="date" id="dueInput">
        </div>
        <div class="field">
            <label for="priorityInput">Priority</label>
            <select id="priorityInput">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
        </div>
        <div class="form-actions">
            <button type="submit" id="submitBtn" class="primary">Add task</button>
            <button type="button" id="cancelEdit" class="ghost" hidden>Cancel</button>
        </div>
        <p id="formError" class="form-error" role="alert" hidden></p>
    </form>

    <section class="stats" aria-label="Task summary">
        <div class="stat-box"><h3 id="totalTasks">0</h3><p>Total</p></div>
        <div class="stat-box"><h3 id="completedTasks">0</h3><p>Completed</p></div>
        <div class="stat-box"><h3 id="pendingTasks">0</h3><p>Pending</p></div>
        <div class="stat-box danger"><h3 id="overdueTasks">0</h3><p>Overdue</p></div>
    </section>

    <div class="progress-wrap">
        <div id="progressBar" class="progress" role="progressbar" aria-label="Completion" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressFill" class="progress-fill"></div>
        </div>
        <span id="progressText">0% done</span>
    </div>

    <div class="toolbar">
        <input type="search" id="searchInput" placeholder="Search tasks (press / to focus)" aria-label="Search tasks">
        <div class="segmented" id="filters" role="group" aria-label="Filter tasks">
            <button type="button" data-filter="all" aria-pressed="true">All <span class="count">0</span></button>
            <button type="button" data-filter="active" aria-pressed="false">Active <span class="count">0</span></button>
            <button type="button" data-filter="completed" aria-pressed="false">Done <span class="count">0</span></button>
        </div>
        <select id="sortSelect" aria-label="Sort tasks">
            <option value="due">Sort: Due date</option>
            <option value="priority">Sort: Priority</option>
            <option value="newest">Sort: Newest first</option>
        </select>
    </div>

    <section class="task-section">
        <h2>My tasks</h2>
        <ul id="taskList" class="notebook"></ul>
        <p id="emptyMessage" class="empty">No tasks yet. Add your first task above.</p>
        <footer class="list-footer">
            <span id="tasksLeft">0 tasks left</span>
            <button id="clearCompleted" class="link" type="button">Clear completed</button>
        </footer>
    </section>

</main>

<div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button id="toastUndo" type="button">Undo</button>
</div>

<script src="script.js"></script>
</body>
</html>
